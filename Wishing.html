<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Smruti 🎉</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    overflow: hidden;
}

/* Center Name */
.center-name {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    font-weight: bold;
    color: black;
    text-shadow: 0 0 10px rgba(255,255,255,0.8);
}

/* Wishes Note */
.center-note {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    color: black;
    background: rgba(255,255,255,0.6);
    padding: 12px 20px;
    border-radius: 15px;
}

/* Bottom Message */
.message {
    position: absolute;
    bottom: 60px;
    width: 100%;
    font-size: 20px;
    color: white;
}

/* Lights */
.light {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: float 5s infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* Flowers */
.flower {
    position: absolute;
    font-size: 20px;
    animation: fall 6s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
}

/* Balloons 🎈 */
.balloon {
    position: absolute;
    font-size: 30px;
    animation: rise 8s linear infinite;
}

@keyframes rise {
    0% { transform: translateY(110vh); }
    100% { transform: translateY(-10vh); }
}

/* Confetti 🎊 */
.confetti {
    position: absolute;
    width: 6px;
    height: 6px;
    background: red;
    animation: confettiFall 4s linear infinite;
}

@keyframes confettiFall {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
}

</style>
</head>

<body>

<div class="center-name">Smruti 🎂</div>

<div class="center-note">
    Happy Birthday! 💖✨ <br>
    May your life be filled with joy, love, and beautiful moments 🌸
</div>

<div class="message">
    Keep smiling always and stay as amazing as you are 🎉🌈
</div>

<script>

/* Lights */
for (let i = 0; i < 30; i++) {
    let light = document.createElement("div");
    light.className = "light";
    light.style.left = Math.random() * 100 + "vw";
    light.style.background = `hsl(${Math.random()*360},100%,70%)`;
    light.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(light);
}

/* Flowers */
let flowers = ["🌸","🌼","🌺","🌷"];
for (let i = 0; i < 25; i++) {
    let flower = document.createElement("div");
    flower.className = "flower";
    flower.innerHTML = flowers[Math.floor(Math.random()*flowers.length)];
    flower.style.left = Math.random() * 100 + "vw";
    flower.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(flower);
}

/* Balloons */
let balloons = ["🎈","🎉","🎊"];
for (let i = 0; i < 15; i++) {
    let balloon = document.createElement("div");
    balloon.className = "balloon";
    balloon.innerHTML = balloons[Math.floor(Math.random()*balloons.length)];
    balloon.style.left = Math.random() * 100 + "vw";
    balloon.style.animationDuration = (Math.random() * 5 + 5) + "s";
    document.body.appendChild(balloon);
}

/* Confetti */
for (let i = 0; i < 40; i++) {
    let confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = `hsl(${Math.random()*360},100%,50%)`;
    confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(confetti);
}

</script>

</body>
</html>
