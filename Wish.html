<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Smruti 🎉</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    overflow: hidden;
}

/* Center Name */
.center-name {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 20px #fff, 0 0 40px pink;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #fff, 0 0 20px pink; }
    to { text-shadow: 0 0 20px #fff, 0 0 40px #ff4da6; }
}

/* Cute message */
.message {
    position: absolute;
    bottom: 80px;
    width: 100%;
    font-size: 22px;
    color: white;
}

/* Floating lights */
.light {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: float 5s infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* Sprinkle flowers */
.flower {
    position: absolute;
    font-size: 20px;
    animation: fall 6s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
}

</style>
</head>

<body>

<div class="center-name">Smruti 🎂</div>

<div class="message">
    Wishing you a day filled with love, laughter, and endless happiness 💖✨<br>
    May your smile shine brighter than these lights 🌸🎉
</div>

<!-- Lights -->
<script>
for (let i = 0; i < 30; i++) {
    let light = document.createElement("div");
    light.className = "light";
    light.style.left = Math.random() * 100 + "vw";
    light.style.background = `hsl(${Math.random()*360},100%,70%)`;
    light.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(light);
}

/* Flowers */
let flowers = ["🌸","🌼","🌺","🌷"];
for (let i = 0; i < 25; i++) {
    let flower = document.createElement("div");
    flower.className = "flower";
    flower.innerHTML = flowers[Math.floor(Math.random()*flowers.length)];
    flower.style.left = Math.random() * 100 + "vw";
    flower.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(flower);
}
</script>

</body>
</html>
